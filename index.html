<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- Barra de Navegación por Iconos -->
        <nav class="dock">
            <button class="dock-btn active" data-view="home" title="Inicio">🏠</button>
            <button class="dock-btn" data-view="schema" title="Estructura">⚡</button>
            <button class="dock-btn" data-view="data" title="Datos">📊</button>
            <button class="dock-btn" data-view="pivot" title="Pivotes">🎯</button>
        </nav>

        <!-- Contenedor de Pantallas -->
        <main class="viewport">
            <!-- Pantalla 1: Inicio -->
            <section id="home" class="screen">
                <div class="hero">
                    <h1>DataForge</h1>
                    <div class="actions-grid">
                        <label class="btn-card accent">
                            📁 Subir Excel / CSV
                            <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" hidden>
                        </label>
                        <button class="btn-card" onclick="goTo('schema')">✏️ Crear Manual</button>
                    </div>
                </div>
            </section>

            <!-- Pantalla 2: Estructura -->
            <section id="schema" class="screen hidden">
                <div class="toolbar">
                    <input type="text" id="col-name" placeholder="Nombre...">
                    <select id="col-type">
                        <option value="string">Texto</option>
                        <option value="number">Número</option>
                        <option value="date">Fecha</option>
                        <option value="boolean">Sí/No</option>
                    </select>
                    <button id="add-col-btn" class="btn icon-btn">＋</button>
                </div>
                <div id="columns-chips" class="chips-container"></div>
                <button id="create-table-btn" class="btn primary-btn hidden">Generar Matriz ➔</button>
            </section>

            <!-- Pantalla 3: Datos -->
            <section id="data" class="screen hidden">
                <div class="toolbar">
                    <button id="add-row-btn" class="btn">＋ Fila</button>
                    <button onclick="goTo('pivot')" class="btn primary-btn">Ir a Pivotes ➔</button>
                </div>
                <div class="table-wrap">
                    <div id="table-container"></div>
                </div>
            </section>

            <!-- Pantalla 4: Pivotes -->
            <section id="pivot" class="screen hidden">
                <div class="toolbar">
                    <select id="pivot-filter-col"></select>
                    <input type="text" id="pivot-filter-val" placeholder="Filtrar por...">
                    <button id="generate-child-btn" class="btn primary-btn">Derivar</button>
                </div>
                <div id="child-table-container"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
