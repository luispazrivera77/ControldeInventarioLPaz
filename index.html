<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge Multi-Form Studio</title>
    <style>
        :root {
            --bg: #050505;
            --phone-bg: #0f1015;
            --surface: #1a1b22;
            --surface-hover: #262733;
            --border: #2a2b38;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 360px;
            height: 720px;
            background: var(--phone-bg);
            border: 6px solid #20212c;
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
            position: relative;
        }

        .phone-notch {
            width: 120px;
            height: 18px;
            background: #20212c;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            align-self: center;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 20px 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .screen.hidden { display: none; }

        h2 {
            font-size: 16px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        input, select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .builder-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            max-height: 260px;
            overflow-y: auto;
        }

        .field-builder-row {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.2s;
        }

        .btn:hover { background: var(--surface-hover); border-color: var(--accent); }
        .btn-primary { background: var(--accent); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); border: none; }
        .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

        .form-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-field label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .badge-step {
            background: var(--accent);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>

        <!-- Pantalla 1: Diseñador Formulario Principal (Form 1) -->
        <section id="screen-builder-1" class="screen">
            <span class="badge-step">Paso 1 de 3</span>
            <h2>Formulario Principal</h2>
            
            <div style="margin-bottom: 10px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Título</label>
                <input type="text" id="f1-title" value="Obras" style="margin-top: 4px;">
            </div>

            <div style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Campos</div>
            <div id="f1-fields" class="builder-container"></div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                <button type="button" onclick="addField(1)" class="btn">＋ Añadir campo</button>
                <button type="button" onclick="goToStep(2)" class="btn btn-primary">Siguiente: Formulario 2 ➔</button>
            </div>
        </section>

        <!-- Pantalla 2: Diseñador Formulario Secundario (Form 2 con Relación/Pivote Opcional) -->
        <section id="screen-builder-2" class="screen hidden">
            <span class="badge-step">Paso 2 de 3</span>
            <h2>Formulario Secundario</h2>
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Título</label>
                <input type="text" id="f2-title" value="Tareas" style="margin-top: 4px;">
            </div>

            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Campo de Relación (Pivote Form 1)</label>
                <select id="f2-pivot-source">
                    <option value="">-- Sin relación pivote --</option>
                </select>
            </div>

            <div style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Campos Propios</div>
            <div id="f2-fields" class="builder-container" style="max-height: 180px;"></div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
                <button type="button" onclick="addField(2)" class="btn">＋ Añadir campo</button>
                <div style="display: flex; gap: 6px;">
                    <button type="button" onclick="goToStep(1)" class="btn" style="flex:1;">◀ Volver</button>
                    <button type="button" onclick="goToStep(3)" class="btn btn-primary" style="flex:1;">Siguiente: Subformulario ➔</button>
                </div>
            </div>
        </section>

        <!-- Pantalla 3: Diseñador Subformulario (Form 3 con Relación/Pivote de Form 2) -->
        <section id="screen-builder-3" class="screen hidden">
            <span class="badge-step">Paso 3 de 3</span>
            <h2>Subformulario</h2>
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Título</label>
                <input type="text" id="f3-title" value="Actividades" style="margin-top: 4px;">
            </div>

            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Campo de Relación (Pivote Form 2)</label>
                <select id="f3-pivot-source">
                    <option value="">-- Sin relación pivote --</option>
                </select>
            </div>

            <div style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Campos Propios</div>
            <div id="f3-fields" class="builder-container" style="max-height: 180px;"></div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
                <button type="button" onclick="addField(3)" class="btn">＋ Añadir campo</button>
                <div style="display: flex; gap: 6px;">
                    <button type="button" onclick="goToStep(2)" class="btn" style="flex:1;">◀ Volver</button>
                    <button type="button" onclick="launchApp()" class="btn btn-success" style="flex:1;">Iniciar App ➔</button>
                </div>
            </div>
        </section>

        <!-- Pantalla 4: Ejecución / Runtime Estilo AppSheet con Navegación Jerárquica -->
        <section id="screen-runtime" class="screen hidden">
            <div class="form-header">
                <div>
                    <span id="runtime-tier-badge" style="background:var(--accent); color:white; padding:2px 5px; border-radius:3px; font-size:9px;">F1</span>
                    <strong id="runtime-title" style="color:var(--text);">Formulario</strong>
                </div>
                <span id="record-indicator">1 / 1</span>
            </div>

            <div id="runtime-card" class="form-card"></div>

            <div class="nav-bar">
                <button onclick="changeRecord(-1)" class="btn">◀ Ant</button>
                <button onclick="addNewRecord()" class="btn">＋ Nuevo</button>
                <button onclick="changeRecord(1)" class="btn">Sig ▶</button>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 8px;">
                <button id="child-drill-btn" onclick="openChildLevel()" class="btn btn-primary" style="flex:1; display:none; font-size:11px;">Ver Subnivel ➔</button>
                <button onclick="backToBuilder()" class="btn btn-danger" style="flex:1; font-size:11px;">⚙️ Editar</button>
            </div>
        </section>
    </div>

    <script>
        // Configuración de los 3 niveles
        let config = {
            1: { title: "Obras", fields: [{name: "Nombre Obra", type: "text"}], data: [{}] },
            2: { title: "Tareas", pivotField: "", fields: [{name: "Descripción", type: "text"}], data: [{}] },
            3: { title: "Actividades", pivotField: "", fields: [{name: "Detalle", type: "text"}], data: [{}] }
        };

        let currentTier = 1;
        let activeIndices = { 1: 0, 2: 0, 3: 0 };

        function goToStep(step) {
            saveBuilderData();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(`screen-builder-${step}`).classList.remove('hidden');
            
            if (step === 2) updatePivotOptions(2, 1, 'f2-pivot-source');
            if (step === 3) updatePivotOptions(3, 2, 'f3-pivot-source');
            renderBuilderFields(step);
        }

        function addField(tier) {
            saveBuilderData();
            config[tier].fields.push({ name: `Campo ${config[tier].fields.length + 1}`, type: 'text' });
            renderBuilderFields(tier);
        }

        function removeField(tier, index) {
            saveBuilderData();
            config[tier].fields.splice(index, 1);
            renderBuilderFields(tier);
        }

        function renderBuilderFields(tier) {
            const container = document.getElementById(`f${tier}-fields`);
            container.innerHTML = '';
            config[tier].fields.forEach((field, index) => {
                const row = document.createElement('div');
                row.className = 'field-builder-row';
                row.innerHTML = `
                    <div class="row-inputs">
                        <input type="text" class="f-name" value="${field.name}" data-tier="${tier}" data-index="${index}">
                        <select class="f-type" data-tier="${tier}" data-index="${index}">
                            <option value="text" ${field.type==='text'?'selected':''}>Texto</option>
                            <option value="number" ${field.type==='number'?'selected':''}>Número</option>
                            <option value="date" ${field.type==='date'?'selected':''}>Fecha</option>
                            <option value="email" ${field.type==='email'?'selected':''}>Email</option>
                            <option value="checkbox" ${field.type==='checkbox'?'selected':''}>Sí/No</option>
                        </select>
                    </div>
                    ${config[tier].fields.length > 1 ? `<button type="button" class="btn btn-danger" onclick="removeField(${tier}, ${index})" style="padding: 2px; font-size: 10px;">Eliminar</button>` : ''}
                `;
                container.appendChild(row);
            });
        }

        function saveBuilderData() {
            config[1].title = document.getElementById('f1-title').value || "Principal";
            config[2].title = document.getElementById('f2-title').value || "Secundario";
            config[3].title = document.getElementById('f3-title').value || "Subformulario";

            config[2].pivotField = document.getElementById('f2-pivot-source').value;
            config[3].pivotField = document.getElementById('f3-pivot-source').value;

            for (let t = 1; t <= 3; t++) {
                const container = document.getElementById(`f${t}-fields`);
                if (!container) continue;
                container.querySelectorAll('.field-builder-row').forEach((row, index) => {
                    const nameInput = row.querySelector('.f-name');
                    const typeSelect = row.querySelector('.f-type');
                    if (config[t].fields[index]) {
                        config[t].fields[index].name = nameInput.value;
                        config[t].fields[index].type = typeSelect.value;
                    }
                });
            }
        }

        function updatePivotOptions(targetTier, sourceTier, selectId) {
            saveBuilderData();
            const select = document.getElementById(selectId);
            const currentVal = config[targetTier].pivotField;
            
            select.innerHTML = `<option value="">-- Sin relación pivote --</option>`;
            config[sourceTier].fields.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name;
                opt.textContent = `[Form ${sourceTier}] ${f.name}`;
                if (f.name === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function launchApp() {
            saveBuilderData();
            currentTier = 1;
            activeIndices = { 1: 0, 2: 0, 3: 0 };
            
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-runtime').classList.remove('hidden');
            renderRuntime();
        }

        function renderRuntime() {
            saveRuntimeData();
            const tierConfig = config[currentTier];
            
            document.getElementById('runtime-tier-badge').textContent = `F${currentTier}`;
            document.getElementById('runtime-title').textContent = tierConfig.title;

            // Si hay pivote activo, filtramos o mostramos contexto
            let recordList = tierConfig.data;
            let activePivotVal = null;

            if (currentTier > 1 && tierConfig.pivotField) {
                const parentTier = currentTier - 1;
                const parentRecord = config[parentTier].data[activeIndices[parentTier]] || {};
                activePivotVal = parentRecord[tierConfig.pivotField] || "(Sin valor)";
            }

            if (recordList.length === 0) recordList = [{}];
            if (activeIndices[currentTier] >= recordList.length) activeIndices[currentTier] = recordList.length - 1;
            if (activeIndices[currentTier] < 0) activeIndices[currentTier] = 0;

            const record = recordList[activeIndices[currentTier]] || {};
            const card = document.getElementById('runtime-card');

            let html = '';
            if (currentTier > 1 && tierConfig.pivotField) {
                html += `<div style="background:var(--surface-hover); padding:6px 10px; border-radius:6px; font-size:11px; border-left:3px solid var(--accent);">
                    Relación (${tierConfig.pivotField}): <strong>${activePivotVal}</strong>
                </div>`;
            }

            tierConfig.fields.forEach(f => {
                const val = record[f.name] !== undefined ? record[f.name] : '';
                html += `<div class="form-field"><label>${f.name}</label>`;
                if (f.type === 'checkbox') {
                    html += `<input type="checkbox" class="r-input" data-name="${f.name}" ${val?'checked':''} style="width:auto;">`;
                } else {
                    html += `<input type="${f.type}" class="r-input" data-name="${f.name}" value="${val}">`;
                }
                html += `</div>`;
            });

            card.innerHTML = html;
            document.getElementById('record-indicator').textContent = `${activeIndices[currentTier] + 1} / ${recordList.length}`;

            // Botón de siguiente nivel (subformulario)
            const drillBtn = document.getElementById('child-drill-btn');
            if (currentTier < 3) {
                drillBtn.style.display = 'block';
                drillBtn.textContent = `Ver ${config[currentTier + 1].title} ➔`;
            } else {
                drillBtn.style.display = 'none';
            }
        }

        function saveRuntimeData() {
            const inputs = document.querySelectorAll('#runtime-card .r-input');
            if (inputs.length === 0) return;
            const obj = config[currentTier].data[activeIndices[currentTier]] || {};
            inputs.forEach(input => {
                obj[input.dataset.name] = input.type === 'checkbox' ? input.checked : input.value;
            });
            config[currentTier].data[activeIndices[currentTier]] = obj;
        }

        function changeRecord(direction) {
            saveRuntimeData();
            const listLen = config[currentTier].data.length;
            activeIndices[currentTier] += direction;
            if (activeIndices[currentTier] < 0) activeIndices[currentTier] = 0;
            if (activeIndices[currentTier] >= listLen) activeIndices[currentTier] = listLen - 1;
            renderRuntime();
        }

        function addNewRecord() {
            saveRuntimeData();
            config[currentTier].data.push({});
            activeIndices[currentTier] = config[currentTier].data.length - 1;
            renderRuntime();
        }

        function openChildLevel() {
            saveRuntimeData();
            if (currentTier < 3) {
                currentTier++;
                renderRuntime();
            }
        }

        function backToBuilder() {
            saveRuntimeData();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-builder-1').classList.remove('hidden');
            renderBuilderFields(1);
        }

        // Inicializar interfaz de constructor
        renderBuilderFields(1);
    </script>
</body>
</html>
