<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge Multi-Form Studio</title>
    <style>
        :root {
            --bg: #050505;
            --phone-bg: #0f1015;
            --surface: #1a1b22;
            --surface-hover: #262733;
            --border: #2a2b38;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --purple: #8b5cf6;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 360px;
            height: 720px;
            background: var(--phone-bg);
            border: 6px solid #20212c;
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
            position: relative;
        }

        .phone-notch {
            width: 120px;
            height: 18px;
            background: #20212c;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            align-self: center;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 20px 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .screen.hidden { display: none; }

        h2 {
            font-size: 16px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        input, select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .builder-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            max-height: 240px;
            overflow-y: auto;
        }

        .field-builder-row {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.2s;
        }

        .btn:hover { background: var(--surface-hover); border-color: var(--accent); }
        .btn-primary { background: var(--accent); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); border: none; }
        .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

        .app-launcher-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            margin-top: 5px;
        }

        .app-icon-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .app-icon-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .app-icon-card.independent {
            border-left: 4px solid var(--text-dim);
        }

        .app-icon-card.related {
            border-left: 4px solid var(--purple);
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.08) 0%, var(--surface) 100%);
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
        }

        .app-tag {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .relation-badge {
            font-size: 9px;
            padding: 3px 7px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-indep { background: rgba(148, 163, 184, 0.15); color: var(--text-dim); }
        .badge-rel { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.3); }

        .form-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-field label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .top-menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>

        <!-- Pantalla de Lanzador / Menú Principal -->
        <section id="screen-launcher" class="screen">
            <div class="top-menu-bar">
                <h2>Mis Formularios</h2>
                <button onclick="startNewForm()" class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;">＋ Crear Formulario</button>
            </div>
            <p style="font-size: 11px; color: var(--text-dim); margin-top:0;">Selecciona un formulario para ejecutar o edítalo:</p>
            
            <div id="launcher-list" class="app-launcher-grid"></div>
        </section>

        <!-- Pantalla de Diseñador de Formulario -->
        <section id="screen-builder" class="screen hidden">
            <div class="top-menu-bar">
                <span id="builder-step-label" style="background:var(--accent); color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600;">Diseñador</span>
                <button onclick="showLauncher()" class="btn" style="padding: 4px 8px; font-size: 10px;">📱 Menú</button>
            </div>
            <h2 id="builder-heading">Configurar Formulario</h2>
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Título del Formulario</label>
                <input type="text" id="form-title-input" placeholder="Ej. Inventario" style="margin-top: 4px;">
            </div>

            <div id="pivot-section" style="margin-bottom: 8px; display: none;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Campo de Relación (Pivote)</label>
                <select id="form-pivot-source">
                    <option value="">-- Sin relación pivote (Independiente) --</option>
                </select>
            </div>

            <div style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Campos</div>
            <div id="builder-fields-container" class="builder-container" style="max-height: 180px;"></div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
                <button type="button" onclick="addBuilderField()" class="btn">＋ Añadir campo</button>
                <button type="button" onclick="saveAndReturnLauncher()" class="btn btn-success">Guardar y Volver al Menú ➔</button>
            </div>
        </section>

        <!-- Pantalla de Ejecución / Runtime -->
        <section id="screen-runtime" class="screen hidden">
            <div class="form-header">
                <div>
                    <span id="runtime-tier-badge" style="background:var(--accent); color:white; padding:2px 5px; border-radius:3px; font-size:9px;">Form</span>
                    <strong id="runtime-title" style="color:var(--text);">Formulario</strong>
                </div>
                <span id="record-indicator">1 / 1</span>
            </div>

            <div id="runtime-card" class="form-card"></div>

            <div class="nav-bar">
                <button onclick="changeRecord(-1)" class="btn">◀ Ant</button>
                <button onclick="addNewRecord()" class="btn">＋ Nuevo</button>
                <button onclick="changeRecord(1)" class="btn">Sig ▶</button>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 8px;">
                <button onclick="showLauncher()" class="btn" style="flex:1; font-size:11px;">📱 Menú Apps</button>
                <button onclick="editCurrentFormStructure()" class="btn btn-danger" style="flex:1; font-size:11px;">⚙️ Editar</button>
            </div>
        </section>
    </div>

    <script>
        let formsRegistry = [
            {
                id: 1,
                title: "Obras",
                pivotFormId: null,
                pivotField: "",
                fields: [{ name: "Nombre Obra", type: "text" }],
                data: [{}]
            }
        ];

        let activeFormId = 1;
        let activeRecordIndex = 0;
        let editingFormId = 1;

        function showLauncher() {
            saveCurrentRuntimeData();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-launcher').classList.remove('hidden');
            renderLauncherList();
        }

        function renderLauncherList() {
            const listContainer = document.getElementById('launcher-list');
            listContainer.innerHTML = '';

            formsRegistry.forEach((form) => {
                const isRelated = form.pivotFormId !== null && form.pivotFormId !== "" && form.pivotFormId !== undefined;
                
                const card = document.createElement('div');
                card.className = `app-icon-card ${isRelated ? 'related' : 'independent'}`;

                let badgeHtml = isRelated 
                    ? `<span class="relation-badge badge-rel">🔗 Relacionado</span>` 
                    : `<span class="relation-badge badge-indep">⚡ Independiente</span>`;

                card.innerHTML = `
                    <div class="app-info" onclick="launchForm(${form.id})" style="flex:1;">
                        <span class="app-tag">Formulario #${form.id}</span>
                        <span class="app-title">${form.title}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${badgeHtml}
                        <button onclick="editFormStructure(${form.id})" class="btn" style="padding:4px 8px; font-size:10px;">⚙️</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function startNewForm() {
            const newId = formsRegistry.length + 1;
            formsRegistry.push({
                id: newId,
                title: `Formulario ${newId}`,
                pivotFormId: null,
                pivotField: "",
                fields: [{ name: "Detalle", type: "text" }],
                data: [{}]
            });
            editFormStructure(newId);
        }

        function editFormStructure(formId) {
            editingFormId = formId;
            const formObj = formsRegistry.find(f => f.id === formId);

            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-builder').classList.remove('hidden');

            document.getElementById('builder-step-label').textContent = `Formulario #${formObj.id}`;
            document.getElementById('form-title-input').value = formObj.title;

            const pivotSection = document.getElementById('pivot-section');
            const pivotSelect = document.getElementById('form-pivot-source');

            const previousForms = formsRegistry.filter(f => f.id !== formObj.id);
            if (previousForms.length > 0) {
                pivotSection.style.display = 'block';
                pivotSelect.innerHTML = `<option value="">-- Sin relación pivote (Independiente) --</option>`;
                
                previousForms.forEach(pf => {
                    pf.fields.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = `${pf.id}::${f.name}`;
                        opt.textContent = `[${pf.title}] ${f.name}`;
                        if (formObj.pivotFormId == pf.id && formObj.pivotField == f.name) {
                            opt.selected = true;
                        }
                        pivotSelect.appendChild(opt);
                    });
                });
            } else {
                pivotSection.style.display = 'none';
            }

            renderBuilderFields();
        }

        function renderBuilderFields() {
            const formObj = formsRegistry.find(f => f.id === editingFormId);
            const container = document.getElementById('builder-fields-container');
            container.innerHTML = '';

            formObj.fields.forEach((field, index) => {
                const row = document.createElement('div');
                row.className = 'field-builder-row';
                row.innerHTML = `
                    <div class="row-inputs">
                        <input type="text" class="f-name" value="${field.name}" data-index="${index}">
                        <select class="f-type" data-index="${index}">
                            <option value="text" ${field.type==='text'?'selected':''}>Texto</option>
                            <option value="number" ${field.type==='number'?'selected':''}>Número</option>
                            <option value="date" ${field.type==='date'?'selected':''}>Fecha</option>
                            <option value="email" ${field.type==='email'?'selected':''}>Email</option>
                            <option value="checkbox" ${field.type==='checkbox'?'selected':''}>Sí/No</option>
                        </select>
                    </div>
                    ${formObj.fields.length > 1 ? `<button type="button" class="btn btn-danger" onclick="removeBuilderField(${index})" style="padding: 2px; font-size: 10px;">Eliminar</button>` : ''}
                `;
                container.appendChild(row);
            });
        }

        function addBuilderField() {
            saveBuilderState();
            const formObj = formsRegistry.find(f => f.id === editingFormId);
            formObj.fields.push({ name: `Campo ${formObj.fields.length + 1}`, type: 'text' });
            renderBuilderFields();
        }

        function removeBuilderField(index) {
            saveBuilderState();
            const formObj = formsRegistry.find(f => f.id === editingFormId);
            formObj.fields.splice(index, 1);
            renderBuilderFields();
        }

        function saveBuilderState() {
            const formObj = formsRegistry.find(f => f.id === editingFormId);
            if (!formObj) return;

            const titleInput = document.getElementById('form-title-input');
            if (titleInput) formObj.title = titleInput.value || `Formulario ${formObj.id}`;

            const pivotSelect = document.getElementById('form-pivot-source');
            if (pivotSelect && pivotSelect.value) {
                const parts = pivotSelect.value.split('::');
                formObj.pivotFormId = parseInt(parts[0]);
                formObj.pivotField = parts[1];
            } else {
                formObj.pivotFormId = null;
                formObj.pivotField = "";
            }

            const container = document.getElementById('builder-fields-container');
            if (container) {
                container.querySelectorAll('.field-builder-row').forEach((row, index) => {
                    const nameInput = row.querySelector('.f-name');
                    const typeSelect = row.querySelector('.f-type');
                    if (formObj.fields[index]) {
                        formObj.fields[index].name = nameInput.value;
                        formObj.fields[index].type = typeSelect.value;
                    }
                });
            }
        }

        function saveAndReturnLauncher() {
            saveBuilderState();
            showLauncher();
        }

        function editCurrentFormStructure() {
            editFormStructure(activeFormId);
        }

        function launchForm(formId) {
            activeFormId = formId;
            activeRecordIndex = 0;
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-runtime').classList.remove('hidden');
            renderRuntime();
        }

        function renderRuntime() {
            saveCurrentRuntimeData();
            const formObj = formsRegistry.find(f => f.id === activeFormId);
            
            document.getElementById('runtime-tier-badge').textContent = `F#${formObj.id}`;
            document.getElementById('runtime-title').textContent = formObj.title;

            let recordList = formObj.data;
            let activePivotVal = null;

            if (formObj.pivotFormId) {
                const parentForm = formsRegistry.find(f => f.id === formObj.pivotFormId);
                if (parentForm && parentForm.data.length > 0) {
                    const parentRec = parentForm.data[0] || {};
                    activePivotVal = parentRec[formObj.pivotField] || "(Sin valor)";
                }
            }

            if (recordList.length === 0) recordList = [{}];
            if (activeRecordIndex >= recordList.length) activeRecordIndex = recordList.length - 1;
            if (activeRecordIndex < 0) activeRecordIndex = 0;

            const record = recordList[activeRecordIndex] || {};
            const card = document.getElementById('runtime-card');

            let html = '';
            if (formObj.pivotFormId && formObj.pivotField) {
                html += `<div style="background:var(--surface-hover); padding:6px 10px; border-radius:6px; font-size:11px; border-left:3px solid var(--purple);">
                    Relación (${formObj.pivotField}): <strong>${activePivotVal}</strong>
                </div>`;
            }

            formObj.fields.forEach(f => {
                const val = record[f.name] !== undefined ? record[f.name] : '';
                html += `<div class="form-field"><label>${f.name}</label>`;
                if (f.type === 'checkbox') {
                    html += `<input type="checkbox" class="r-input" data-name="${f.name}" ${val?'checked':''} style="width:auto;">`;
                } else {
                    html += `<input type="${f.type}" class="r-input" data-name="${f.name}" value="${val}">`;
                }
                html += `</div>`;
            });

            card.innerHTML = html;
            document.getElementById('record-indicator').textContent = `${activeRecordIndex + 1} / ${recordList.length}`;
        }

        function saveCurrentRuntimeData() {
            const formObj = formsRegistry.find(f => f.id === activeFormId);
            if (!formObj) return;

            const inputs = document.querySelectorAll('#runtime-card .r-input');
            if (inputs.length === 0) return;
            
            if (!formObj.data[activeRecordIndex]) {
                formObj.data[activeRecordIndex] = {};
            }

            const obj = formObj.data[activeRecordIndex];
            inputs.forEach(input => {
                obj[input.dataset.name] = input.type === 'checkbox' ? input.checked : input.value;
            });
        }

        function changeRecord(direction) {
            saveCurrentRuntimeData();
            const formObj = formsRegistry.find(f => f.id === activeFormId);
            const listLen = formObj.data.length;
            
            // Si intentamos avanzar y estamos en el último registro, creamos uno nuevo automáticamente en blanco
            if (direction > 0 && activeRecordIndex === listLen - 1) {
                formObj.data.push({});
                activeRecordIndex = formObj.data.length - 1;
            } else {
                activeRecordIndex += direction;
                if (activeRecordIndex < 0) activeRecordIndex = 0;
                if (activeRecordIndex >= listLen) activeRecordIndex = listLen - 1;
            }
            renderRuntime();
        }

        function addNewRecord() {
            saveCurrentRuntimeData();
            const formObj = formsRegistry.find(f => f.id === activeFormId);
            formObj.data.push({});
            activeRecordIndex = formObj.data.length - 1;
            renderRuntime();
        }

        showLauncher();
    </script>
</body>
</html>
