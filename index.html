<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge Form Builder Mobile</title>
    <style>
        :root {
            --bg: #050505;
            --phone-bg: #0f1015;
            --surface: #1a1b22;
            --surface-hover: #262733;
            --border: #2a2b38;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Celular Estilizado */
        .phone-frame {
            width: 360px;
            height: 720px;
            background: var(--phone-bg);
            border: 6px solid #20212c;
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
            position: relative;
        }

        .phone-notch {
            width: 120px;
            height: 18px;
            background: #20212c;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            align-self: center;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 20px 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .screen.hidden { display: none; }

        /* Títulos y Contenedores */
        h2 {
            font-size: 18px;
            margin: 0 0 15px 0;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        input, select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: var(--accent); }

        /* Pantalla 1: Constructor de Campos */
        .builder-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .field-builder-row {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover { background: var(--surface-hover); border-color: var(--accent); }
        .btn-primary { background: var(--accent); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

        /* Pantalla 2: Vista de Registros / Formulario Interactivo */
        .form-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-field label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>

        <!-- Pantalla 1: Diseñador del Formulario -->
        <section id="screen-builder" class="screen">
            <h2 id="app-main-title">Nuevo Formulario</h2>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase;">Título del Formulario</label>
                <input type="text" id="form-title-input" placeholder="Ej. Control de Obras" style="margin-top: 4px;">
            </div>

            <div style="font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">Definir Campos</div>
            
            <div id="fields-container" class="builder-container" style="max-height: 380px; overflow-y: auto; gap: 10px;">
                <!-- Filas dinámicas de campos -->
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                <button type="button" id="add-field-btn" class="btn">＋ Añadir otro campo</button>
                <button type="button" id="launch-form-btn" class="btn btn-primary">Iniciar Aplicación ➔</button>
            </div>
        </section>

        <!-- Pantalla 2: Vista de Registros (Llenado tipo AppSheet) -->
        <section id="screen-runtime" class="screen hidden">
            <div class="form-header">
                <span id="runtime-form-title">Formulario</span>
                <span id="record-indicator">Registro 1 de 1</span>
            </div>

            <div id="runtime-form-card" class="form-card"></div>

            <div class="nav-bar">
                <button id="prev-btn" class="btn">◀ Ant</button>
                <button id="add-record-btn" class="btn">＋ Nuevo</button>
                <button id="next-btn" class="btn">Sig ▶</button>
            </div>
            <button id="back-to-builder" class="btn btn-danger" style="margin-top: 10px; font-size: 11px; padding: 6px;">⚙️ Modificar Estructura</button>
        </section>
    </div>

    <script>
        let formConfig = {
            title: "Mi Formulario",
            fields: [
                { name: "Obra", type: "text" },
                { name: "Fecha", type: "date" }
            ]
        };

        let records = [{}];
        let currentRecordIndex = 0;

        const screenBuilder = document.getElementById('screen-builder');
        const screenRuntime = document.getElementById('screen-runtime');
        const fieldsContainer = document.getElementById('fields-container');
        const formTitleInput = document.getElementById('form-title-input');
        
        const runtimeFormTitle = document.getElementById('runtime-form-title');
        const runtimeFormCard = document.getElementById('runtime-form-card');
        const recordIndicator = document.getElementById('record-indicator');

        function initBuilder() {
            formTitleInput.value = formConfig.title;
            renderBuilderFields();
        }

        function renderBuilderFields() {
            fieldsContainer.innerHTML = '';
            formConfig.fields.forEach((field, index) => {
                const row = document.createElement('div');
                row.className = 'field-builder-row';
                row.innerHTML = `
                    <div class="row-inputs">
                        <input type="text" class="field-name" placeholder="Nombre del campo" value="${field.name}" data-index="${index}">
                        <select class="field-type" data-index="${index}">
                            <option value="text" ${field.type === 'text' ? 'selected' : ''}>Texto</option>
                            <option value="number" ${field.type === 'number' ? 'selected' : ''}>Número</option>
                            <option value="date" ${field.type === 'date' ? 'selected' : ''}>Fecha</option>
                            <option value="email" ${field.type === 'email' ? 'selected' : ''}>Email</option>
                            <option value="checkbox" ${field.type === 'checkbox' ? 'selected' : ''}>Sí/No</option>
                        </select>
                    </div>
                    ${formConfig.fields.length > 1 ? `<button type="button" class="btn btn-danger" onclick="removeField(${index})" style="padding: 4px; font-size: 11px;">Eliminar campo</button>` : ''}
                `;
                fieldsContainer.appendChild(row);
            });

            // Registrar eventos de cambio instantáneo
            fieldsContainer.querySelectorAll('.field-name').forEach(input => {
                input.addEventListener('input', (e) => {
                    formConfig.fields[e.target.dataset.index].name = e.target.value;
                });
            });

            fieldsContainer.querySelectorAll('.field-type').forEach(select => {
                select.addEventListener('change', (e) => {
                    formConfig.fields[e.target.dataset.index].type = e.target.value;
                });
            });
        }

        window.removeField = function(index) {
            saveBuilderState();
            formConfig.fields.splice(index, 1);
            renderBuilderFields();
        };

        function saveBuilderState() {
            formConfig.title = formTitleInput.value.trim() || "Formulario";
            fieldsContainer.querySelectorAll('.field-builder-row').forEach((row, index) => {
                const nameInput = row.querySelector('.field-name');
                const typeSelect = row.querySelector('.field-type');
                if(formConfig.fields[index]) {
                    formConfig.fields[index].name = nameInput.value;
                    formConfig.fields[index].type = typeSelect.value;
                }
            });
        }

        document.getElementById('add-field-btn').addEventListener('click', () => {
            saveBuilderState();
            formConfig.fields.push({ name: `Campo ${formConfig.fields.length + 1}`, type: 'text' });
            renderBuilderFields();
        });

        document.getElementById('launch-form-btn').addEventListener('click', () => {
            saveBuilderState();
            if (formConfig.fields.length === 0) {
                alert('Añade al menos un campo para continuar.');
                return;
            }

            runtimeFormTitle.textContent = formConfig.title;
            currentRecordIndex = 0;
            if(records.length === 0) records = [{}];
            
            renderRuntimeForm();
            screenBuilder.classList.add('hidden');
            screenRuntime.classList.remove('hidden');
        });

        document.getElementById('back-to-builder').addEventListener('click', () => {
            saveCurrentRecord();
            screenRuntime.classList.add('hidden');
            screenBuilder.classList.remove('hidden');
        });

        function renderRuntimeForm() {
            const record = records[currentRecordIndex] || {};
            let html = '';

            formConfig.fields.forEach(field => {
                const val = record[field.name] !== undefined ? record[field.name] : '';
                html += `<div class="form-field"><label>${field.name}</label>`;

                if (field.type === 'checkbox') {
                    html += `<input type="checkbox" class="runtime-input" data-name="${field.name}" ${val ? 'checked' : ''} style="width: auto; margin-top: 5px;">`;
                } else {
                    html += `<input type="${field.type}" class="runtime-input" data-name="${field.name}" value="${val}">`;
                }
                html += `</div>`;
            });

            runtimeFormCard.innerHTML = html;
            recordIndicator.textContent = `Registro ${currentRecordIndex + 1} de ${records.length}`;
        }

        function saveCurrentRecord() {
            if (records.length === 0) return;
            const inputs = runtimeFormCard.querySelectorAll('.runtime-input');
            const obj = {};
            inputs.forEach(input => {
                obj[input.dataset.name] = input.type === 'checkbox' ? input.checked : input.value;
            });
            records[currentRecordIndex] = obj;
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            saveCurrentRecord();
            if (currentRecordIndex < records.length - 1) {
                currentRecordIndex++;
                renderRuntimeForm();
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            saveCurrentRecord();
            if (currentRecordIndex > 0) {
                currentRecordIndex--;
                renderRuntimeForm();
            }
        });

        document.getElementById('add-record-btn').addEventListener('click', () => {
            saveCurrentRecord();
            records.push({});
            currentRecordIndex = records.length - 1;
            renderRuntimeForm();
        });

        // Inicializar con dos campos por defecto
        initBuilder();
    </script>
</body>
</html>
